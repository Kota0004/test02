# 全国展開に使えるデータ入手口を調べる（手動実行・1回限りの調査用）
#
# 開発コンテナからは mlit.go.jp / gsi.go.jp に出られないため、
# ネットワークに出られる Actions 側で調べて結果をログに出す。
#
# ⚠️ 調査のための1回きりの取得。定期的な自動取得は意図していない。
#    各サイトの利用条件に従うこと。
name: データ入手口の調査

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r 災害アプリ/tools/requirements.txt

      # ① 首都圏: 関東地方整備局は1都7県を所管していて、千葉のPDFもここ由来。
      #    同じ整備局なら表の作りも揃っている見込みがあるので、県別PDFの一覧を取る。
      - name: 関東地方整備局の県別PDFを探す
        working-directory: 災害アプリ
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          URL = "https://www.ktr.mlit.go.jp/road/bousai/road_bousai00000001.html"
          req = urllib.request.Request(URL, headers={"User-Agent": "mizumichi-research/0.1"})
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          print(f"取得: {URL}  ({len(html)} bytes)\n")

          # リンクテキストと href を組で拾う
          pairs = re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', html, re.S | re.I)
          hits = []
          for href, text in pairs:
              t = re.sub(r"<[^>]+>", "", text)
              t = re.sub(r"\s+", " ", t).strip()
              if ".pdf" in href.lower() and any(k in t for k in
                      ("都", "県", "冠水", "マップ")):
                  hits.append((t, urllib.parse.urljoin(URL, href)))
          print(f"県別PDFらしきリンク: {len(hits)} 件")
          for t, u in hits:
              print(f"  {t}\n      {u}")
          PY

      # ② 全国: 重ねるハザードマップの「道路冠水想定箇所」レイヤ。
      #    全国分が1つの機械可読な形で出ているなら、これが本命になる。
      - name: 重ねるハザードマップの道路防災レイヤを調べる
        working-directory: 災害アプリ
        run: |
          for u in \
            "https://disaportal.gsi.go.jp/hazardmap/copyright/kansuisouteikasyo.html" \
            "https://disaportal.gsi.go.jp/maps/index.html?layerset=douro" ; do
            echo "=============================================="
            echo "  $u"
            echo "=============================================="
            python3 tools/probe_endpoints.py --url "$u" || echo "(失敗)"
            echo
          done

      # ③ 掲載状況一覧に CSV があるかを直接見る
      - name: 掲載状況一覧の中身を見る
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          URL = "https://disaportal.gsi.go.jp/hazardmap/copyright/kansuisouteikasyo.html"
          try:
              req = urllib.request.Request(URL, headers={"User-Agent": "mizumichi-research/0.1"})
              html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          except Exception as e:
              print("取得できませんでした:", e); raise SystemExit(0)
          print(f"{len(html)} bytes\n")
          for href in re.findall(r'href="([^"]+)"', html):
              if any(href.lower().endswith(e) for e in (".csv", ".xlsx", ".xls", ".json", ".geojson")):
                  print("  データファイル:", urllib.parse.urljoin(URL, href))
          # 表の行数と、都道府県名がいくつ出てくるか
          rows = len(re.findall(r"<tr", html, re.I))
          print(f"\n表の行数: {rows}")
          PY
