# 試作アプリを GitHub Pages に公開する。
#
#   https://kota0004.github.io/test02/
#
# 公開するのは 災害アプリ/prototype/ の中身だけで、授業課題のファイルは載らない。
name: アプリを公開

on:
  # 通常のコミット（人が push したとき）
  push:
    branches: [claude/github-file-org-report-docp9t]
    paths:
      - "災害アプリ/prototype/**"
      - ".github/workflows/pages.yml"

  # 毎時の危険度更新のあと。
  #
  # ⚠️ GITHUB_TOKEN による push は次のワークフローを起動しない仕様なので、
  #    「雨量と危険度を更新」のコミットでは上の push が発火しない。
  #    ワークフローの完了を合図にするこちらで拾う。
  workflow_run:
    workflows: ["雨量と危険度を更新"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開中に次の更新が重なっても、最新のものが最後に残るようにする。
# 進行中を打ち切らないのは、中途半端な状態で公開されるのを避けるため。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 更新が失敗した回はそのままなので公開しない
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run では既定で「起動元のワークフローが動いた時点」の
          # コミットになる。最新の危険度を載せたいので既定ブランチの先端を取る。
          ref: claude/github-file-org-report-docp9t

      - name: 公開するファイルを確かめる
        run: |
          cd 災害アプリ/prototype
          test -f index.html   || { echo "index.html がない"; exit 1; }
          test -f risk.js      || { echo "risk.js がない"; exit 1; }
          test -f data/spots_chiba.json || { echo "危険箇所データがない"; exit 1; }
          echo "公開するファイル:"
          find . -type f | sort

      # Pages がまだ有効になっていないかを先に見る。
      #
      # ワークフローの GITHUB_TOKEN では Pages サイトを「新規作成」できない
      # （Resource not accessible by integration）。有効化だけは人が一度だけ
      # 押す必要があるので、それまではここで理由を言って正常終了する。
      # 待っている間ずっと赤いより、何をすればいいかが分かる方がよい。
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "404" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            {
              echo "### 公開を始めるにはスイッチを1回入れてください"
              echo
              echo "1. https://github.com/${{ github.repository }}/settings/pages を開く"
              echo "2. **Build and deployment** の **Source** を **GitHub Actions** にする"
              echo "3. このワークフローを Re-run する（以後は自動）"
              echo
              echo "ワークフローの権限では Pages を新規作成できないため、ここだけ手作業が要ります。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Pages が未設定です。上の手順のあと再実行してください。"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "Pages の状態を取得できませんでした (HTTP $code)"
            cat /tmp/pages.json
            exit 1
          fi
          echo "ready=yes" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.ready == 'yes'
        uses: actions/configure-pages@v5

      - if: steps.check.outputs.ready == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 災害アプリ/prototype

      - if: steps.check.outputs.ready == 'yes'
        id: deploy
        uses: actions/deploy-pages@v4
